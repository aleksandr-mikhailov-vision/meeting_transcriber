[project]
name = "meeting-transcribator"
version = "0.1.0"
description = "Transcribe m4a (and other audio) recordings to raw-text .md files via the OpenAI API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
    "mistralai>=1.0.0",
    "imageio-ffmpeg>=0.5.1",
    "python-dotenv>=1.0.1",
]

[project.scripts]
transcribe = "meeting_transcribator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_transcribator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
